<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luffy's Voyage: A Grand Line Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ocean-backdrop"></div>

<div class="game-frame">

  <header class="game-header">
    <img src="assets/luffy.png" class="emblem-img" alt="Luffy">
    <div class="title-block">
      <h1 class="game-title">LUFFY'S VOYAGE</h1>
      <p class="game-subtitle">A Grand Line Trail</p>
    </div>
  </header>

  <div class="stat-bar" id="statBar">
    <div class="stat-tile">
      <span class="stat-label">BOND</span>
      <span class="stat-value" id="bondValue">50</span>
      <div class="gauge"><div class="gauge-fill bond-fill" id="bondFill"></div></div>
    </div>
    <div class="stat-tile">
      <span class="stat-label">RESOLVE</span>
      <span class="stat-value" id="resolveValue">50</span>
      <div class="gauge"><div class="gauge-fill resolve-fill" id="resolveFill"></div></div>
    </div>
    <div class="stat-tile">
      <span class="stat-label">INFAMY</span>
      <span class="stat-value" id="infamyValue">10</span>
      <div class="gauge"><div class="gauge-fill infamy-fill" id="infamyFill"></div></div>
    </div>
    <div class="stat-tile" id="foodTile">
      <span class="stat-label">FOOD</span>
      <span class="stat-value" id="foodValue">60</span>
      <div class="gauge"><div class="gauge-fill food-fill" id="foodFill"></div></div>
    </div>
  </div>

  <div class="game-body">
    <main class="scene-panel" id="scenePanel"></main>
    <aside class="crew-sidebar" id="crewSidebar"></aside>
  </div>

  <nav class="trail-map" id="trailMap"></nav>

  <footer class="game-footer">
    <p>Set sail and chase the legend. Every choice charts a different course.</p>
  </footer>

</div>

<script src="js/story-data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
